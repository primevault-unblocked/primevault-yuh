<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrimeVault</title>
<style>
  :root{--bg:#12141c;--panel:#1c1f2e;--line:#2c3047;--text:#eceaf4;--mute:#9a98b0;--accent:#ffb020}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
  header{position:sticky;top:0;z-index:5;display:flex;gap:18px;align-items:center;flex-wrap:wrap;
    padding:12px clamp(14px,4vw,40px);background:var(--bg);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px;font-size:1.35rem;font-weight:800}
  .brand svg{width:38px;height:38px;flex:none}
  .brand span{color:var(--accent)}
  nav{display:flex;gap:6px}
  nav button{font:inherit;font-weight:700;color:var(--mute);background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;cursor:pointer}
  nav button[aria-selected=true]{color:var(--text);border-color:var(--accent)}
  #q{margin-left:auto;flex:1;min-width:160px;max-width:360px;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--text);font:inherit}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  main{padding:clamp(14px,4vw,40px)}
  section[hidden]{display:none}
  #count{color:var(--mute);margin:0 0 16px;font-size:.9rem}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
  .card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
  .card:hover{border-color:var(--accent)}
  .thumb{aspect-ratio:1;display:grid;place-items:center;font-size:2.6rem;font-weight:800;color:var(--bg)}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .name{padding:10px 12px;font-size:.9rem;font-weight:700}
  #empty{display:none;color:var(--mute);padding:40px 0}
  .emu{max-width:900px;margin:0 auto}
  .emu h2{margin:0 0 6px}
  .emu p{color:var(--mute);margin:0 0 18px;line-height:1.5}
  .pick{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));margin-bottom:16px}
  .drop{display:block;padding:18px;border:1px dashed var(--line);border-radius:14px;background:var(--panel);cursor:pointer}
  .drop:hover{border-color:var(--accent)}
  .drop b{display:block;margin-bottom:4px}
  .drop small{color:var(--mute);word-break:break-all}
  .drop input{display:none}
  button.act{font:inherit;font-weight:700;color:#14161f;background:var(--accent);border:0;border-radius:10px;padding:10px 18px;cursor:pointer}
  button.act:disabled{opacity:.4;cursor:not-allowed}
  button.sub{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;margin-left:6px}
  #stage{display:none;position:fixed;inset:0;z-index:20;background:#000;flex-direction:column}
  #stage.open{display:flex}
  #bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
  #stitle{margin-right:auto;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #frame{flex:1;width:100%;border:0;background:#000}
  #note{font-size:.85rem;color:var(--mute);margin-top:14px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg viewBox="0 0 48 48" aria-hidden="true">
      <polygon points="24,2 43,13 43,35 24,46 5,35 5,13" fill="#1c1f2e" stroke="#ffb020" stroke-width="2.5"/>
      <circle cx="24" cy="24" r="10" fill="none" stroke="#ffb020" stroke-width="2"/>
      <path d="M24 14v4M24 30v4M14 24h4M30 24h4" stroke="#ffb020" stroke-width="2" stroke-linecap="round"/>
      <circle cx="24" cy="24" r="3" fill="#ffb020"/>
    </svg>
    <div>Prime<span>Vault</span></div>
  </div>
  <nav role="tablist">
    <button role="tab" id="t-games" aria-selected="true" data-tab="games">Games</button>
    <button role="tab" id="t-n64" aria-selected="false" data-tab="n64">N64</button>
  </nav>
  <input id="q" type="search" placeholder="Search games" aria-label="Search games" autocomplete="off">
</header>

<main>
  <section id="games">
    <p id="count"></p>
    <div id="grid"></div>
    <p id="empty">No games match that search.</p>
  </section>

  <section id="n64" hidden>
    <div class="emu">
      <h2>N64 emulator</h2>
      <p>Pick a game file and play it right here. Add a save file (.srm) too if you have one, and it loads with the game.</p>
      <div class="pick">
        <label class="drop"><b>Game file</b><small id="romName">.z64 (also .n64, .v64)</small>
          <input id="rom" type="file" accept=".z64,.n64,.v64"></label>
        <label class="drop"><b>Save file (optional)</b><small id="srmName">.srm</small>
          <input id="srm" type="file" accept=".srm"></label>
      </div>
      <button class="act" id="play" disabled>Play</button>
      <p id="note">Files stay on your device. The emulator code loads from the EmulatorJS CDN, so you need an internet connection.</p>
    </div>
  </section>
</main>

<div id="stage" role="dialog" aria-modal="true" aria-label="Emulator">
  <div id="bar">
    <span id="stitle"></span>
    <button class="sub" id="dlsave">Download save</button>
    <button class="sub" id="full">Fullscreen</button>
    <button class="sub" id="close">Close</button>
  </div>
  <iframe id="frame" allow="fullscreen; gamepad; autoplay" allowfullscreen></iframe>
</div>

<script>
/* ADD YOUR GAMES HERE: name, file (path from repo root), optional thumb */
const GAMES = [
  { name: "Example Game", file: "games/example.html" },
  { name: "Another Game", file: "games/another/index.html", thumb: "thumbs/another.png" }
];

const $ = id => document.getElementById(id);
const colors = ["#ffb020","#6ee7b7","#93c5fd","#f9a8d4","#c4b5fd","#fca5a5","#fde68a","#a7f3d0"];
const hue = s => colors[[...s].reduce((a,c)=>a+c.charCodeAt(0),0) % colors.length];

/* tabs */
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.setAttribute("aria-selected", x === b));
  ["games","n64"].forEach(id => $(id).hidden = id !== b.dataset.tab);
  $("q").style.visibility = b.dataset.tab === "games" ? "visible" : "hidden";
});

/* games grid + player */
function render(list){
  $("grid").textContent = "";
  list.forEach(g => {
    const b = document.createElement("button"); b.className = "card";
    const t = document.createElement("div"); t.className = "thumb";
    t.style.background = hue(g.name); t.textContent = g.name.charAt(0).toUpperCase();
    if (g.thumb){ const i = new Image(); i.alt = ""; i.loading = "lazy"; i.src = g.thumb;
      i.onload = () => { t.textContent = ""; t.appendChild(i); }; }
    const n = document.createElement("div"); n.className = "name"; n.textContent = g.name;
    b.append(t, n); b.onclick = () => openStage(g.name, g.file, false);
    $("grid").appendChild(b);
  });
  $("count").textContent = list.length + (list.length === 1 ? " game" : " games");
  $("empty").style.display = list.length ? "none" : "block";
}
$("q").addEventListener("input", () => {
  const s = $("q").value.trim().toLowerCase();
  render(GAMES.filter(g => g.name.toLowerCase().includes(s)));
});
GAMES.sort((a,b) => a.name.localeCompare(b.name)); render(GAMES);

/* stage */
const frame = $("frame");
function openStage(title, src, emu){
  $("stitle").textContent = title;
  $("dlsave").style.display = emu ? "" : "none";
  if (emu) frame.srcdoc = src; else frame.src = src;
  $("stage").classList.add("open"); document.body.style.overflow = "hidden";
}
function closeStage(){
  $("stage").classList.remove("open"); document.body.style.overflow = "";
  frame.removeAttribute("srcdoc"); frame.src = "about:blank";
}
$("close").onclick = closeStage;
$("full").onclick = () => (frame.requestFullscreen || frame.webkitRequestFullscreen).call(frame);
document.addEventListener("keydown", e => { if (e.key === "Escape" && $("stage").classList.contains("open") && !document.fullscreenElement) closeStage(); });

/* N64 via EmulatorJS */
let romFile = null, srmFile = null;
$("rom").onchange = e => { romFile = e.target.files[0] || null; $("romName").textContent = romFile ? romFile.name : ".z64 (also .n64, .v64)"; $("play").disabled = !romFile; };
$("srm").onchange = e => { srmFile = e.target.files[0] || null; $("srmName").textContent = srmFile ? srmFile.name : ".srm"; };

$("play").onclick = () => {
  const romUrl = URL.createObjectURL(romFile);
  const srmUrl = srmFile ? URL.createObjectURL(srmFile) : "";
  const cdn = "https://cdn.emulatorjs.org/stable/data/";
  const doc = '<!DOCTYPE html><body style="margin:0;background:#000"><div id="game" style="width:100vw;height:100vh"></div><script>'
    + 'EJS_player="#game";EJS_core="n64";EJS_gameName=' + JSON.stringify(romFile.name.replace(/\.[^.]+$/, "")) + ';'
    + 'EJS_gameUrl=' + JSON.stringify(romUrl) + ';EJS_pathtodata=' + JSON.stringify(cdn) + ';EJS_startOnLoaded=true;'
    + 'EJS_onGameStart=function(){var u=' + JSON.stringify(srmUrl) + ';if(!u)return;'
    + 'fetch(u).then(function(r){return r.arrayBuffer()}).then(function(b){var g=EJS_emulator.gameManager;'
    + 'g.FS.writeFile(g.getSaveFilePath(),new Uint8Array(b));g.loadSaveFiles();}).catch(function(){});};'
    + '<\/script><script src="' + cdn + 'loader.js"><\/script>';
  openStage(romFile.name, doc, true);
};

$("dlsave").onclick = () => {
  try {
    const data = frame.contentWindow.EJS_emulator.gameManager.getSaveFile();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([data]));
    a.download = $("stitle").textContent.replace(/\.[^.]+$/, "") + ".srm"; a.click();
  } catch (e) { alert("No save data yet. Save in the game first, then try again."); }
};
</script>
</body>
</html>
